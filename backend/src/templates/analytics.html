<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Type Analytics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Crime Dashboard</a>
            <div class="d-flex">
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>Crime Analytics Dashboard</h2>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Top Crime Types</h5>
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Area-wise Crime Breakdown</h5>
                        <canvas id="areaChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Victim Gender Distribution</h5>
                        <canvas id="genderChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Weapon Usage</h5>
                        <canvas id="weaponChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Hourly Crime Distribution</h5>
                        <canvas id="hourlyChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Victim Age Group Distribution</h5>
                        <canvas id="ageGroupChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Crime Domain Breakdown</h5>
                        <canvas id="domainChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Top Criminals</h5>
                        <canvas id="suspectChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Crime Heatmap (Area Hotspots)</h5>
                        <div id="heatmap" style="height: 400px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script>
        // Top Crime Types
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: {{ top_types_labels|tojson }},
                datasets: [{
                    label: 'Number of Crimes',
                    data: {{ top_types_values|tojson }},
                    backgroundColor: 'rgba(54, 162, 235, 0.7)'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        // Area-wise Crime Breakdown
        new Chart(document.getElementById('areaChart'), {
            type: 'bar',
            data: {
                labels: {{ area_labels|tojson }},
                datasets: [{
                    label: 'Crimes by Area',
                    data: {{ area_values|tojson }},
                    backgroundColor: 'rgba(75, 192, 192, 0.7)'
                }]
            },
            options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        // Victim Gender Distribution
        new Chart(document.getElementById('genderChart'), {
            type: 'pie',
            data: {
                labels: {{ gender_labels|tojson }},
                datasets: [{
                    data: {{ gender_values|tojson }},
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)', 'rgba(54, 162, 235, 0.7)', 'rgba(255, 206, 86, 0.7)'
                    ]
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        // Weapon Usage
        new Chart(document.getElementById('weaponChart'), {
            type: 'bar',
            data: {
                labels: {{ weapon_labels|tojson }},
                datasets: [{
                    label: 'Weapon Usage',
                    data: {{ weapon_values|tojson }},
                    backgroundColor: 'rgba(255, 159, 64, 0.7)'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        // Hourly Crime Distribution
        new Chart(document.getElementById('hourlyChart'), {
            type: 'bar',
            data: {
                labels: {{ hourly_labels|tojson }},
                datasets: [{
                    label: 'Crimes by Hour',
                    data: {{ hourly_values|tojson }},
                    backgroundColor: 'rgba(255, 159, 64, 0.7)'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        // Victim Age Group Distribution
        new Chart(document.getElementById('ageGroupChart'), {
            type: 'pie',
            data: {
                labels: {{ agegroup_labels|tojson }},
                datasets: [{
                    data: {{ agegroup_values|tojson }},
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)', 'rgba(54, 162, 235, 0.7)', 'rgba(255, 206, 86, 0.7)', 'rgba(75, 192, 192, 0.7)'
                    ]
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        // Crime Domain Breakdown
        new Chart(document.getElementById('domainChart'), {
            type: 'bar',
            data: {
                labels: {{ domain_labels|tojson }},
                datasets: [{
                    label: 'Crimes by Domain',
                    data: {{ domain_values|tojson }},
                    backgroundColor: 'rgba(153, 102, 255, 0.7)'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        // Top Criminals
        new Chart(document.getElementById('suspectChart'), {
            type: 'bar',
            data: {
                labels: {{ suspect_labels|tojson }},
                datasets: [{
                    label: 'FIRs by Criminal',
                    data: {{ suspect_values|tojson }},
                    backgroundColor: 'rgba(255, 99, 71, 0.7)'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
        // Heatmap (Leaflet)
        var heatmapCoords = {{ heatmap_coords|tojson }};
        if (heatmapCoords.length > 0) {
            var map = L.map('heatmap').setView([heatmapCoords[0][0], heatmapCoords[0][1]], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            var heat = L.heatLayer(heatmapCoords, {radius: 25, blur: 15, maxZoom: 17}).addTo(map);
        } else {
            document.getElementById('heatmap').innerHTML = '<div class="alert alert-warning">No location data for heatmap.</div>';
        }
    </script>
</body>
</html>
