<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE ANONYMOUS INTELLIGENCE | CMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --stealth-black: #050505;
            --stealth-accent: #ff0055;
            --stealth-glow: rgba(255, 0, 85, 0.1);
            --glass-bg: rgba(20, 20, 20, 0.8);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--stealth-black);
            background-image: 
                radial-gradient(circle at 50% -20%, #1a1a1a 0%, transparent 70%),
                radial-gradient(circle at 0% 100%, var(--stealth-glow) 0%, transparent 40%);
            color: #ccc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stealth-title {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .security-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--stealth-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0.5rem 1rem;
            border: 1px solid var(--stealth-accent);
            display: inline-block;
            margin-bottom: 2rem;
            background: rgba(255, 0, 85, 0.05);
        }

        .form-label-stealth {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 0.75rem;
            display: block;
        }

        .form-control-stealth {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #222;
            color: #fff;
            padding: 1rem;
            border-radius: 0;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .form-control-stealth:focus {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--stealth-accent);
            box-shadow: none;
            color: #fff;
        }

        .geoint-box {
            border: 1px solid #222;
            padding: 1.5rem;
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-stealth {
            background: transparent;
            border: 1px solid var(--stealth-accent);
            color: var(--stealth-accent);
            padding: 1rem 3rem;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            transition: all 0.4s;
            border-radius: 0;
        }

        .btn-stealth:hover {
            background: var(--stealth-accent);
            color: #fff;
            box-shadow: 0 0 30px var(--stealth-glow);
        }

        .privacy-warning {
            border-left: 2px solid var(--stealth-accent);
            padding-left: 1.5rem;
            margin-bottom: 3rem;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>
    <div class="container py-5 mt-lg-5">
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <div class="privacy-warning">
                    <div class="security-badge"><i class="fas fa-ghost me-2"></i>Stealth Handshake Active</div>
                    <h1 class="stealth-title h2 mb-3">Anonymous Intelligence</h1>
                    <p class="text-secondary small mb-0">Your identity is shielded by multi-layered encryption. No IP logs, no trace, just the data.</p>
                </div>

                <div class="glass-card p-4 p-md-5">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="row g-4">
                            <!-- Category Selection -->
                            <div class="col-md-6">
                                <label class="form-label-stealth">Operational Category</label>
                                <select class="form-select form-control-stealth" name="crime_type" required>
                                    <option value="">SELECT CATEGORY</option>
                                    <option value="Theft">THEFT</option>
                                    <option value="Drug Possession">NARCOTICS</option>
                                    <option value="Kidnapping">KIDNAPPING</option>
                                    <option value="Burglary">BURGLARY</option>
                                    <option value="Sexual Harassment">HARASSMENT</option>
                                    <option value="Fraud">FRAUD</option>
                                    <option value="Homicide">HOMICIDE</option>
                                    <option value="Vandalism">VANDALISM</option>
                                    <option value="Assault">ASSAULT</option>
                                    <option value="Other">OTHER INTEL</option>
                                </select>
                            </div>

                            <!-- Payload Attachment -->
                            <div class="col-md-6">
                                <label class="form-label-stealth">Intelligence Payload (Optional)</label>
                                <input type="file" class="form-control-stealth w-100" name="evidence_file">
                            </div>

                            <!-- Intel Description -->
                            <div class="col-12">
                                <label class="form-label-stealth">Intelligence Narrative</label>
                                <textarea class="form-control-stealth w-100" name="description" rows="5" 
                                    placeholder="TRANSMIT DATA HERE. DO NOT INCLUDE PERSONAL IDENTIFIERS." required></textarea>
                            </div>

                            <!-- Geo-Spacial Metadata -->
                            <div class="col-12">
                                <div class="geoint-box">
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div>
                                            <h6 class="fw-bold text-white mb-1 font-monospace">GEO-SPACIAL DATA</h6>
                                            <small class="text-secondary uppercase">Coordinates required for deployment</small>
                                        </div>
                                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-0 border-opacity-25" id="getLocationBtn">
                                            <i class="fas fa-crosshairs me-2"></i>ACQUIRE SIGNAL
                                        </button>
                                    </div>
                                    <div class="row g-3">
                                        <div class="col-6">
                                            <input type="number" step="any" name="latitude" id="latitude" class="form-control-stealth w-100 font-monospace" placeholder="LAT: 0.00" required readonly>
                                        </div>
                                        <div class="col-6">
                                            <input type="number" step="any" name="longitude" id="longitude" class="form-control-stealth w-100 font-monospace" placeholder="LON: 0.00" required readonly>
                                        </div>
                                    </div>
                                    <div id="locationStatus" class="mt-2 text-secondary extra-small font-monospace">
                                        SIGNAL STATUS: WAITING...
                                    </div>
                                </div>
                            </div>

                            <!-- Execution -->
                            <div class="col-12 text-center mt-5">
                                <button type="submit" class="btn btn-stealth">
                                    <i class="fas fa-satellite-dish me-2"></i> Transmit Intel
                                </button>
                                <div class="mt-4">
                                    <a href="{{ url_for('main.home') }}" class="text-secondary text-uppercase extra-small font-monospace opacity-50 text-decoration-none hover-white">
                                        <i class="fas fa-times me-1"></i> Abort Transmission
                                    </a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('getLocationBtn').addEventListener('click', function () {
            const btn = this;
            const statusText = document.getElementById('locationStatus');

            if (navigator.geolocation) {
                statusText.innerHTML = 'ACQUIRING ENCRYPTED SIGNAL...';
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('latitude').value = pos.coords.latitude;
                        document.getElementById('longitude').value = pos.coords.longitude;
                        statusText.innerHTML = '<span class="text-success">SIGNAL SECURED.</span>';
                        btn.innerHTML = '<i class="fas fa-check"></i> ACQUIRED';
                        btn.classList.add('border-success', 'text-success');
                    },
                    (err) => {
                        statusText.innerHTML = '<span class="text-danger">SIGNAL FAILURE. ENABLE GPS.</span>';
                    }
                );
            }
        });
    </script>
</body>
</html>
