<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO-SPACIAL HOTSPOT TRACKING | CMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --cms-bg: #030712;
            --cms-card: rgba(17, 24, 39, 0.7);
            --cms-accent: #38bdf8;
            --cms-accent-glow: rgba(56, 189, 248, 0.2);
            --cms-border: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--cms-bg);
            background-image:
                radial-gradient(circle at 100% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(239, 68, 68, 0.05) 0%, transparent 50%);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            /* Fixed structure for the viewport map */
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: 80px;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--cms-border);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
            z-index: 1000;
        }

        .sidebar-link {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: var(--cms-accent-glow);
            color: var(--cms-accent);
            box-shadow: 0 0 15px var(--cms-accent-glow);
        }

        /* Main Content Container */
        .main-viewport {
            margin-left: 80px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Floating HUD */
        .hud-overlay {
            position: absolute;
            top: 2rem;
            left: 100px;
            right: 2rem;
            z-index: 500;
            pointer-events: none;
        }

        .glass-hud {
            background: var(--cms-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--cms-border);
            border-radius: 1rem;
            padding: 1rem 2rem;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .map-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #10b981;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Filter HUD */
        .filter-hud {
            position: absolute;
            bottom: 2rem;
            left: 100px;
            z-index: 500;
        }

        .form-select-hud {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--cms-border);
            color: #fff;
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-select-hud:focus {
            border-color: var(--cms-accent);
            box-shadow: 0 0 15px var(--cms-accent-glow);
        }

        /* Map Body */
        .map-frame {
            flex-grow: 1;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(0.3) contrast(1.1) brightness(0.9);
        }

        /* Target Intel Link */
        .target-intel-hud {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            z-index: 500;
        }

        .btn-intel {
            background: var(--cms-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--cms-border);
            color: var(--cms-accent);
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-intel:hover {
            background: var(--cms-accent);
            color: #000;
            box-shadow: 0 0 20px var(--cms-accent-glow);
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <a href="/dashboard" class="sidebar-link" title="Dashboard"><i class="fas fa-th-large"></i></a>
        <a href="/analysis/analytics" class="sidebar-link" title="Strategic Intel"><i
                class="fas fa-satellite-dish"></i></a>
        <a href="/analysis/hotspot" class="sidebar-link active" title="Geo-Fencing"><i
                class="fas fa-map-location-dot"></i></a>
        <a href="/fir/records" class="sidebar-link" title="Case Files"><i class="fas fa-folder-open"></i></a>
        <a href="/logout" class="sidebar-link" title="Disconnect" style="margin-top: auto;"><i
                class="fas fa-power-off"></i></a>
    </div>

    <div class="main-viewport">
        <!-- Floating HUD -->
        <div class="hud-overlay">
            <div class="glass-hud">
                <div>
                    <h1 class="map-title">Predictive Geo-Fence</h1>
                    <div class="extra-small text-secondary mt-1 font-monospace">SCANNING ACTIVE SECTOR: {{
                        selected_locality or 'GLOBAL' }}</div>
                </div>
                <div class="live-status">
                    <span class="pulse-dot"></span>
                    LIVE TELEMETRY
                </div>
            </div>
        </div>

        <!-- Locality Filter HUD -->
        <div class="filter-hud">
            <form method="post" id="localityForm">
                <select class="form-select-hud" name="locality" onchange="this.form.submit()">
                    <option value="All" {% if not selected_locality or selected_locality=='All' %}selected{% endif %}>
                        GLOBAL COVERAGE</option>
                    {% for loc in localities %}
                    <option value="{{ loc }}" {% if selected_locality==loc %}selected{% endif %}>{{ loc|upper }} SECTOR
                    </option>
                    {% endfor %}
                </select>
            </form>
        </div>

        <!-- Map Frame -->
        <div class="map-frame">
            {% if error %}
            <div class="h-100 d-flex flex-column align-items-center justify-content-center bg-black">
                <i class="fas fa-triangle-exclamation text-danger mb-3 fa-3x"></i>
                <p class="text-secondary font-monospace">TELEMETRY FAILURE: {{ error }}</p>
            </div>
            {% elif map_path %}
            <iframe src="/{{ map_path }}"></iframe>
            {% else %}
            <div class="h-100 d-flex align-items-center justify-content-center bg-black">
                <p class="text-secondary font-monospace">AWAITING SIGNAL LOCK...</p>
            </div>
            {% endif %}
        </div>

        <!-- Intelligence Hub Link -->
        <div class="target-intel-hud">
            <a href="{{ url_for('analysis.criminals_list') }}" class="btn-intel">
                <i class="fas fa-shield-halved"></i>
                Access Intelligence Hub
            </a>
        </div>
    </div>
</body>

</html>
