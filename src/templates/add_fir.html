<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New FIR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #232526 0%, #1e222d 100%);
            position: relative;
            overflow-x: hidden;
            animation: fadeInBody 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: url('https://thumbs.dreamstime.com/b/emergency-response-police-cars-chase-fog-night-emergency-response-police-cars-chase-fog-night-293135057.jpg') center center/cover no-repeat;
            filter: blur(4px) brightness(0.5);
            opacity: 0.7;
            pointer-events: none;
            animation: bgmove 18s linear infinite alternate;
        }
        body::after {
            /* Animated blue/red police light glow */
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 20% 80%, rgba(0,123,255,0.18) 0, transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(220,53,69,0.13) 0, transparent 60%);
            animation: policeGlow 4s ease-in-out infinite alternate;
        }
        @keyframes bgmove {
            0% { background-position: center 0; }
            100% { background-position: center 20px; }
        }
        @keyframes policeGlow {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .lightbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 8px;
            z-index: 10;
            background: linear-gradient(90deg, #007bff 0%, #dc3545 100%);
            box-shadow: 0 0 24px 6px #007bff88, 0 0 24px 6px #dc354588;
            animation: lightbarMove 2.5s linear infinite alternate;
        }
        @keyframes lightbarMove {
            0% { filter: blur(2px) brightness(1.1); }
            100% { filter: blur(6px) brightness(1.3); }
        }
        .glass-header {
            margin-top: 32px;
            margin-bottom: 2.5rem;
            padding: 1.5rem 2.5rem 1.2rem 2.5rem;
            border-radius: 1.5rem;
            background: rgba(30, 34, 45, 0.55);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.25);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            position: relative;
        }
        .glass-header .fa-file-circle-plus {
            color: #0d6efd;
            font-size: 2.7rem;
        }
        .glass-header .fir-title {
            color: #fff;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .glass-card {
            border-radius: 1.25rem;
            background: rgba(255,255,255,0.18);
            box-shadow: 0 6px 24px rgba(0,0,0,0.12);
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255,255,255,0.18);
            transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
        }
        .glass-card:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 32px rgba(13,110,253,0.18);
            background: rgba(255,255,255,0.28);
        }
        .fir-form .form-label {
            font-weight: 600;
            color: #232526;
        }
        .fir-form .form-control, .fir-form .form-select {
            border-radius: 0.75rem;
            font-size: 1.1rem;
            background: rgba(255,255,255,0.97);
            color: #232526;
            font-weight: 600;
        }
        .fir-form .btn-primary {
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.15);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .fir-form .btn-primary:hover {
            background: #0b5ed7;
            box-shadow: 0 4px 16px rgba(13, 110, 253, 0.25);
        }
        .alert {
            border-radius: 0.75rem;
            font-size: 1rem;
        }
        @media (max-width: 576px) {
            .glass-header { flex-direction: column; gap: 0.5rem; padding: 1rem 0.7rem; }
            .glass-header .fir-title { font-size: 1.3rem; }
            .glass-card { padding: 1rem 0.7rem; }
        }
        .fir-container { animation: fadeInBody 1.2s 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
    </style>
</head>
<body>
    <div class="lightbar"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Crime Dashboard</a>
            <div class="d-flex">
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container fir-container">
        <div class="glass-header mb-4">
            <i class="fa-solid fa-file-circle-plus"></i>
            <span class="fir-title">Add New FIR</span>
        </div>
        <div class="glass-card p-4 mb-4">
            {% if message %}
                <div class="alert alert-info">{{ message }}</div>
            {% endif %}
            <form method="POST" action="/fir/add" class="fir-form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="locality" class="form-label">Locality</label>
                        <select class="form-select" id="locality" name="Locality" required>
                            <option value="">Select Locality</option>
                            <option value="Turade">Turade</option>
                            <option value="Gulsunde">Gulsunde</option>
                            <option value="Waveghar">Waveghar</option>
                            <option value="Rees">Rees</option>
                            <option value="Mohopada">Mohopada</option>
                            <option value="Kambe">Kambe</option>
                            <option value="Karade">Karade</option>
                            <option value="Chambarli">Chambarli</option>
                            <option value="Dapivali">Dapivali</option>
                            <option value="Siddheshwari">Siddheshwari</option>
                            <option value="Ambivali">Ambivali</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="latitude" class="form-label">Latitude</label>
                        <input type="number" step="any" class="form-control" id="latitude" name="Latitude" required>
                    </div>
                    <div class="col-md-3">
                        <label for="longitude" class="form-label">Longitude</label>
                        <input type="number" step="any" class="form-control" id="longitude" name="Longitude" required>
                    </div>
                    <div class="col-md-6">
                        <label for="crime_description" class="form-label">Crime Description</label>
                        <select class="form-select" id="crime_description" name="Crime Description" required>
                            <option value="">Select Crime Description</option>
                            <option value="Theft">Theft</option>
                            <option value="Drug Possession">Drug Possession</option>
                            <option value="Kidnapping">Kidnapping</option>
                            <option value="Burglary">Burglary</option>
                            <option value="Sexual Harassment">Sexual Harassment</option>
                            <option value="Fraud">Fraud</option>
                            <option value="Homicide">Homicide</option>
                            <option value="Vandalism">Vandalism</option>
                            <option value="Hostage Situation">Hostage Situation</option>
                            <option value="Assault">Assault</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="crime_domain" class="form-label">Crime Domain</label>
                        <select class="form-select" id="crime_domain" name="Crime Domain" required>
                            <option value="">Select Crime Domain</option>
                            <option value="Property Crime">Property Crime</option>
                            <option value="Cybercrime">Cybercrime</option>
                            <option value="Drug-Related">Drug-Related</option>
                            <option value="Violent Crime">Violent Crime</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="weapon_used" class="form-label">Weapon Used</label>
                        <input type="text" class="form-control" id="weapon_used" name="Weapon Used">
                    </div>
                    <div class="col-md-3">
                        <label for="hour" class="form-label">Hour</label>
                        <input type="number" min="0" max="23" class="form-control" id="hour" name="Hour" required>
                    </div>
                    <div class="col-md-3">
                        <label for="victim_age" class="form-label">Victim Age</label>
                        <input type="number" min="0" class="form-control" id="victim_age" name="Victim Age" required>
                    </div>
                    <div class="col-md-6">
                        <label for="victim_gender" class="form-label">Victim Gender</label>
                        <select class="form-select" id="victim_gender" name="Victim Gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="criminal_name" class="form-label">Criminal Name</label>
                        <input type="text" class="form-control" id="criminal_name" name="Criminal Name">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-4 w-100">Submit FIR</button>
            </form>
        </div>
    </div>
</body>
</html>
