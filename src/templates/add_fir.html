<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New FIR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #232526 0%, #1e222d 100%);
            position: relative;
            overflow-x: hidden;
            animation: fadeInBody 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: url('https://thumbs.dreamstime.com/b/emergency-response-police-cars-chase-fog-night-emergency-response-police-cars-chase-fog-night-293135057.jpg') center center/cover no-repeat;
            filter: blur(4px) brightness(0.5);
            opacity: 0.7;
            pointer-events: none;
            animation: bgmove 18s linear infinite alternate;
        }
        body::after {
            /* Animated blue/red police light glow */
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 20% 80%, rgba(0,123,255,0.18) 0, transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(220,53,69,0.13) 0, transparent 60%);
            animation: policeGlow 4s ease-in-out infinite alternate;
        }
        @keyframes bgmove {
            0% { background-position: center 0; }
            100% { background-position: center 20px; }
        }
        @keyframes policeGlow {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .lightbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 8px;
            z-index: 10;
            background: linear-gradient(90deg, #007bff 0%, #dc3545 100%);
            box-shadow: 0 0 24px 6px #007bff88, 0 0 24px 6px #dc354588;
            animation: lightbarMove 2.5s linear infinite alternate;
        }
        @keyframes lightbarMove {
            0% { filter: blur(2px) brightness(1.1); }
            100% { filter: blur(6px) brightness(1.3); }
        }
        .glass-header {
            margin-top: 32px;
            margin-bottom: 2.5rem;
            padding: 1.5rem 2.5rem 1.2rem 2.5rem;
            border-radius: 1.5rem;
            background: rgba(30, 34, 45, 0.55);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.25);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            position: relative;
        }
        .glass-header .fa-file-circle-plus {
            color: #0d6efd;
            font-size: 2.7rem;
        }
        .glass-header .fir-title {
            color: #fff;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .glass-card {
            border-radius: 1.25rem;
            background: rgba(255,255,255,0.18);
            box-shadow: 0 6px 24px rgba(0,0,0,0.12);
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255,255,255,0.18);
            transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
        }
        .glass-card:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 32px rgba(13,110,253,0.18);
            background: rgba(255,255,255,0.28);
        }
        .fir-form .form-label {
            font-weight: 600;
            color: #232526;
        }
        .fir-form .form-control, .fir-form .form-select {
            border-radius: 0.75rem;
            font-size: 1.1rem;
            background: rgba(255,255,255,0.97);
            color: #232526;
            font-weight: 600;
        }
        .fir-form .btn-primary {
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.15);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .fir-form .btn-primary:hover {
            background: #0b5ed7;
            box-shadow: 0 4px 16px rgba(13, 110, 253, 0.25);
        }
        .alert {
            border-radius: 0.75rem;
            font-size: 1rem;
        }
        @media (max-width: 576px) {
            .glass-header { flex-direction: column; gap: 0.5rem; padding: 1rem 0.7rem; }
            .glass-header .fir-title { font-size: 1.3rem; }
            .glass-card { padding: 1rem 0.7rem; }
        }
        .fir-container { animation: fadeInBody 1.2s 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
    </style>
</head>
<body>
    <div class="lightbar"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Crime Dashboard</a>
            <div class="d-flex">
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container fir-container">
        <div class="glass-header mb-4">
            <i class="fa-solid fa-file-circle-plus"></i>
            <span class="fir-title">Add New FIR</span>
        </div>
        <div class="glass-card p-4 mb-4">
            {% if message %}
                <div class="alert alert-info">{{ message }}</div>
            {% endif %}
            <form method="POST" action="/fir/add" class="fir-form" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="crime_type" class="form-label">Crime Type</label>
                        <select class="form-select" id="crime_type" name="crime_type" required>
                            <option value="">Select Crime Type</option>
                            <option value="Theft">Theft</option>
                            <option value="Drug Possession">Drug Possession</option>
                            <option value="Kidnapping">Kidnapping</option>
                            <option value="Burglary">Burglary</option>
                            <option value="Sexual Harassment">Sexual Harassment</option>
                            <option value="Fraud">Fraud</option>
                            <option value="Homicide">Homicide</option>
                            <option value="Vandalism">Vandalism</option>
                            <option value="Hostage Situation">Hostage Situation</option>
                            <option value="Assault">Assault</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="evidence_file" class="form-label">Evidence File (Optional)</label>
                        <input type="file" class="form-control" id="evidence_file" name="evidence_file" 
                               accept=".txt,.pdf,.png,.jpg,.jpeg,.gif,.doc,.docx">
                        <div class="form-text">Supported formats: TXT, PDF, Images, Documents</div>
                    </div>
                    <div class="col-md-12">
                        <label for="description" class="form-label">Crime Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" 
                                  placeholder="Provide detailed description of the incident..." required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label for="latitude" class="form-label">Latitude</label>
                        <input type="number" step="any" class="form-control" id="latitude" name="latitude" required>
                    </div>
                    <div class="col-md-6">
                        <label for="longitude" class="form-label">Longitude</label>
                        <input type="number" step="any" class="form-control" id="longitude" name="longitude" required>
                    </div>
                </div>
                
                <!-- Location Capture Section -->
                <div class="mt-3 p-3 bg-light rounded">
                    <label class="form-label">Location Capture</label>
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        <strong>GPS Location:</strong> 
                        <span id="locationStatus">Click "Get Location" to capture your current coordinates</span>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-primary" id="getLocationBtn">
                            <i class="fas fa-map-marker-alt"></i> Get Current Location
                        </button>
                        <div id="locationDisplay" class="d-none">
                            <small class="text-muted">
                                <i class="fas fa-check-circle text-success"></i>
                                Location captured: <span id="coordinates"></span>
                            </small>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary mt-4 w-100">Submit FIR</button>
            </form>
        </div>
    </div>

    <script>
        let userLocation = null;

        // Location capture functionality
        document.getElementById('getLocationBtn').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        userLocation = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        };
                        
                        document.getElementById('latitude').value = userLocation.lat;
                        document.getElementById('longitude').value = userLocation.lon;
                        
                        document.getElementById('locationStatus').textContent = 'Location captured successfully!';
                        document.getElementById('coordinates').textContent = 
                            `${userLocation.lat.toFixed(6)}, ${userLocation.lon.toFixed(6)}`;
                        document.getElementById('locationDisplay').classList.remove('d-none');
                        
                        this.textContent = 'Location Updated';
                        this.classList.remove('btn-outline-primary');
                        this.classList.add('btn-success');
                    },
                    function(error) {
                        document.getElementById('locationStatus').textContent = 
                            'Error: ' + (error.message || 'Unable to get location');
                        console.error('Geolocation error:', error);
                    }
                );
            } else {
                document.getElementById('locationStatus').textContent = 
                    'Geolocation is not supported by this browser.';
            }
        });
    </script>
</body>
</html>
