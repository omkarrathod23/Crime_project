<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View FIR Records</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Crime Dashboard</a>
            <div class="d-flex">
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>View FIR Records</h2>
        {% if firs and firs|length > 0 %}
        <div class="row mb-3">
            <div class="col-md-3">
                <label for="areaFilter" class="form-label">Filter by Area (Locality):</label>
                <select id="areaFilter" class="form-select">
                    <option value="">All Areas</option>
                    {% set localities = firs | map(attribute='Locality') | unique | list %}
                    {% for loc in localities %}
                        <option value="{{ loc }}">{{ loc }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label for="crimeTypeFilter" class="form-label">Filter by Crime Type:</label>
                <select id="crimeTypeFilter" class="form-select">
                    <option value="">All Types</option>
                    {% set crime_types = firs | map(attribute='Crime Description') | unique | list %}
                    {% for ct in crime_types %}
                        <option value="{{ ct }}">{{ ct }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label for="genderFilter" class="form-label">Filter by Victim Gender:</label>
                <select id="genderFilter" class="form-select">
                    <option value="">All Genders</option>
                    {% set genders = firs | map(attribute='Victim Gender') | unique | list %}
                    {% for g in genders %}
                        <option value="{{ g }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label for="dateRange" class="form-label">Filter by Date Range:</label>
                <input type="text" id="dateRange" class="form-control" autocomplete="off" placeholder="Select date range">
            </div>
        </div>
        <div class="table-responsive">
            <table id="firsTable" class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        {% for h in headers %}
                        <th>{{ h }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tfoot>
                    <tr>
                        {% for h in headers %}
                        <th><input type="text" class="form-control form-control-sm column-search" placeholder="Search {{ h }}" /></th>
                        {% endfor %}
                    </tr>
                </tfoot>
                <tbody>
                    {% for row in firs %}
                    <tr>
                        {% for h in headers %}
                        <td>{{ row[h] }}</td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
            <div class="alert alert-info">No FIR records found.</div>
        {% endif %}
    </div>
    <!-- jQuery and DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <script>
        $(document).ready(function() {
            var table = $('#firsTable').DataTable({
                dom: 'Bfrtip',
                buttons: [
                    'csv', 'excel', 'pdf', 'print'
                ],
                pageLength: 10,
                lengthMenu: [5, 10, 25, 50, 100],
                order: [],
                initComplete: function() {
                    // Move footer search boxes to thead for better UX
                    this.api().columns().every(function() {
                        var column = this;
                        $('input', column.footer()).appendTo($(column.header())).on('keyup change clear', function() {
                            if (column.search() !== this.value) {
                                column.search(this.value).draw();
                            }
                        });
                    });
                }
            });
            // Area filter
            $('#areaFilter').on('change', function() {
                var val = $(this).val();
                table.column(0).search(val ? '^' + $.fn.dataTable.util.escapeRegex(val) + '$' : '', true, false).draw();
            });
            // Crime Type filter
            $('#crimeTypeFilter').on('change', function() {
                var val = $(this).val();
                var colIdx = {{ headers.index('Crime Description') }};
                table.column(colIdx).search(val ? '^' + $.fn.dataTable.util.escapeRegex(val) + '$' : '', true, false).draw();
            });
            // Gender filter
            $('#genderFilter').on('change', function() {
                var val = $(this).val();
                var colIdx = {{ headers.index('Victim Gender') }};
                table.column(colIdx).search(val ? '^' + $.fn.dataTable.util.escapeRegex(val) + '$' : '', true, false).draw();
            });
            // Date range filter
            var minDate, maxDate;
            $('#dateRange').daterangepicker({
                autoUpdateInput: false,
                locale: { cancelLabel: 'Clear' }
            });
            $('#dateRange').on('apply.daterangepicker', function(ev, picker) {
                $(this).val(picker.startDate.format('YYYY-MM-DD') + ' - ' + picker.endDate.format('YYYY-MM-DD'));
                minDate = picker.startDate;
                maxDate = picker.endDate;
                table.draw();
            });
            $('#dateRange').on('cancel.daterangepicker', function(ev, picker) {
                $(this).val('');
                minDate = maxDate = null;
                table.draw();
            });
            // Custom filter for date range
            $.fn.dataTable.ext.search.push(
                function(settings, data, dataIndex) {
                    if(typeof minDate === 'undefined' || typeof maxDate === 'undefined' || !minDate || !maxDate) {
                        return true;
                    }
                    var dateIdx = {{ headers.index('Date') if 'Date' in headers else 0 }};
                    var dateStr = data[dateIdx];
                    if(!dateStr) return false;
                    var date = moment(dateStr, 'YYYY-MM-DD');
                    return date.isBetween(minDate, maxDate, null, '[]');
                }
            );
        });
    </script>
</body>
</html>
