<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Management System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: url('https://thumbs.dreamstime.com/b/emergency-response-police-cars-chase-fog-night-emergency-response-police-cars-chase-fog-night-293135057.jpg') center center/cover no-repeat;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 34, 45, 0.75);
            z-index: 0;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .login-card {
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            background: rgba(255, 255, 255, 0.97);
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            max-width: 400px;
            width: 100%;
            animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .login-logo svg {
            width: 70px;
            height: 70px;
            display: block;
        }
        .login-title {
            font-weight: 700;
            color: #232526;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 1px;
        }
        .form-label {
            font-weight: 500;
            color: #343a40;
        }
        .form-control {
            border-radius: 0.75rem;
            font-size: 1.1rem;
        }
        .btn-primary {
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(13, 110, 253, 0.15);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            background: #0b5ed7;
            box-shadow: 0 4px 16px rgba(13, 110, 253, 0.25);
        }
        .alert {
            border-radius: 0.75rem;
            font-size: 1rem;
        }
        @media (max-width: 576px) {
            .login-card {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo mb-2">
                <!-- Police badge SVG icon -->
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="32" cy="32" r="30" fill="#0d6efd" stroke="#fff" stroke-width="4"/>
                  <path d="M32 12 L38 28 L56 28 L41 39 L47 56 L32 45 L17 56 L23 39 L8 28 L26 28 Z" fill="#fff" stroke="#0d6efd" stroke-width="2"/>
                  <circle cx="32" cy="32" r="6" fill="#0d6efd" stroke="#fff" stroke-width="2"/>
                </svg>
            </div>
            <h2 class="login-title mb-4">Crime Management System</h2>
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-danger" role="alert">
                  {{ messages[0] }}
                </div>
              {% endif %}
            {% endwith %}
            <form method="POST" action="">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
