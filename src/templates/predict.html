<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Crime - Crime Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Crime Dashboard</a>
            <div class="d-flex">
                <a href="/logout" class="btn btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Predict Crime Type</h2>
        <form method="POST" class="mt-4">
            <div class="mb-3">
                <label for="location" class="form-label">Location (Locality)</label>
                <input type="text" class="form-control" id="location" name="location" required>
            </div>
            <div class="mb-3">
                <label for="hour" class="form-label">Hour (0-23)</label>
                <input type="number" class="form-control" id="hour" name="hour" min="0" max="23" required>
            </div>
            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>
        {% if prediction %}
        <div class="alert alert-info mt-4">
            <h4>Predicted Crime Type:</h4>
            <p class="lead">{{ prediction }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
